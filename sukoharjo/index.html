<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laporan Kinerja - TeraSukoharjo</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {

      <div id="disclaimer-modal" class="modal-overlay">
  <div class="modal-box">
    <h2>Perhatian & Imbauan Penggunaan Data</h2>
    <p>
      Data dan informasi yang tersaji di portal <strong>TeraSukoharjo</strong> bersifat internal/terbatas. 
      Mohon dapat dipergunakan secara bijak, bijaksana, dan hanya untuk kepentingan dinas/analisis yang sah.
    </p>
    <ul>
      <li>Dilarang menyebarluaskan data tanpa izin pihak berwenang.</li>
      <li>Gunakan informasi dengan penuh rasa tanggung jawab.</li>
    </ul>
    <button id="btn-accept" onclick="closeDisclaimer()">Saya Mengerti & Setuju</button>
  </div>
</div>font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: radial-gradient(circle at top right, rgba(45, 106, 79, 0.08), transparent 35%), #f0f4f2;
      color: #1b2621;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(27, 67, 50, 0.08);
      border-top: 5px solid #2d6a4f;
      max-width: 480px;
      width: 100%;
      text-align: center;
    }
    h1 {
      font-size: 28px;
      font-weight: 800;
      color: #1b4332;
      margin-bottom: 4px;
    }
    .subtitle {
      font-size: 14px;
      color: #2d6a4f;
      font-weight: 600;
      margin-bottom: 24px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      text-align: left;
      margin-bottom: 16px;
    }
    label {
      font-size: 13px;
      font-weight: 700;
      color: #2d6a4f;
      margin-bottom: 6px;
    }
    select {
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #c2d5cb;
      background-color: #f8faf9;
      font-size: 14px;
      color: #1b2621;
      outline: none;
    }
    select:focus {
      border-color: #2d6a4f;
    }
    .btn-submit {
      width: 100%;
      margin-top: 10px;
      background: #2d6a4f;
      color: #ffffff;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-submit:hover {
      background: #1b4332;
    }
    .info-redirect {
      margin-top: 15px;
      font-size: 12px;
      color: #52796f;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>TeraSukoharjo</h1>
    <p class="subtitle">Tenteram - Makmur - Sukses</p>

    <!-- Pilihan Unit -->
    <div class="form-group">
      <label for="unitSelect"><i class="fa-solid fa-building"></i> Pilih Unit</label>
      <select id="unitSelect">
        <option value="sukoharjo" selected>Sukoharjo</option>
      </select>
    </div>

    <!-- Pilihan Periode -->
    <div class="form-group">
      <label for="periodeSelect"><i class="fa-solid fa-calendar-days"></i> Pilih Periode</label>
      <select id="periodeSelect">
        <option value="2026-08">Agustus 2026</option>
        <option value="2026-07">Juli 2026</option>

      </select>
    </div>

    <button class="btn-submit" onclick="bukaLaporan()">
      Buka Laporan <i class="fa-solid fa-arrow-right"></i>
    </button>

    <p class="info-redirect" id="redirectStatus">
      <i class="fa-solid fa-spinner fa-spin"></i> Mengarahkan ke periode terbaru...
    </p>
  </div>

  <script>
    const PERIODE_TERBARU = "2026-08";

    // Set nilai default dropdown ke periode terbaru
    document.getElementById("periodeSelect").value = PERIODE_TERBARU;

    function bukaLaporan() {
      const unit = document.getElementById("unitSelect").value;
      const periode = document.getElementById("periodeSelect").value;

      if (unit === "sukoharjo") {
        window.location.href = `${periode}/index.html`;
      } else {
        window.location.href = `../${unit}/${periode}/index.html`;
      }
    }

    // Auto-redirect otomatis saat halaman dibuka (jika tanpa query manual ?noauto=true)
    const urlParams = new URLSearchParams(window.location.search);
    if (!urlParams.has('noauto')) {
      // Memberikan sedikit jeda (1,5 detik) agar UI sempat terlihat sebelum redirect
      setTimeout(() => {
        window.location.href = `${PERIODE_TERBARU}/index.html`;
      }, 1500);
    } else {
      document.getElementById("redirectStatus").style.display = "none";
    }
  </script>

</body>
</html>
